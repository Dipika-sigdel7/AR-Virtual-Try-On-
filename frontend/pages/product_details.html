<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details - AR Ecommerce</title>

    <link
        rel="stylesheet"
        href="/css/product_details.css"
    >

</head>

<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="navbar">

    <div class="nav-container">

        <a
            href="/"
            class="logo"
        >
            AR Ecommerce
        </a>


        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/products">
                Products
            </a>

            <a href="/cart">
                Cart
            </a>

            <a
                href="/login"
                id="loginNav"
            >
                Login
            </a>

        </div>

    </div>

</nav>


<!-- =====================================================
     PRODUCT DETAILS PAGE
===================================================== -->

<main class="product-page">


    <!-- =================================================
         LOADING
    ================================================== -->

    <div
        id="loading"
        class="loading"
    >
        Loading product...
    </div>


    <!-- =================================================
         ERROR
    ================================================== -->

    <div
        id="errorMessage"
        class="error-message"
        style="display: none;"
    >
        Product not found.
    </div>


    <!-- =================================================
         PRODUCT
    ================================================== -->

    <section
        id="productDetails"
        class="product-details"
        style="display: none;"
    >


        <!-- =================================================
             PRODUCT IMAGE
        ================================================== -->

        <div class="product-image-section">

            <div class="product-image-container">

                <img
                    id="productImage"
                    src=""
                    alt="Product"
                >

            </div>

        </div>


        <!-- =================================================
             PRODUCT INFORMATION
        ================================================== -->

        <div class="product-info">


            <!-- CATEGORY -->

            <span
                id="productCategory"
                class="category"
            >
                Category
            </span>


            <!-- PRODUCT NAME -->

            <h1 id="productName">
                Product Name
            </h1>


            <!-- RATING -->

            <div class="rating">

                <span id="productRating">
                    ★ 0.0
                </span>

                <span class="rating-label">
                    Rating
                </span>

            </div>


            <!-- PRICE -->

            <div
                id="productPrice"
                class="price"
            >
                Rs. 0
            </div>


            <!-- DESCRIPTION -->

            <div class="description">

                <h2>
                    Description
                </h2>

                <p id="productDescription">
                    No description available.
                </p>

            </div>


            <!-- AVAILABILITY -->

            <div class="availability">

                <strong>
                    Availability:
                </strong>

                <span id="productStock">
                    Checking...
                </span>

            </div>


            <!-- QUANTITY -->

            <div class="quantity-section">

                <label for="quantity">
                    Quantity
                </label>


                <div class="quantity-control">

                    <button
                        type="button"
                        id="decreaseBtn"
                    >
                        −
                    </button>


                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                    >


                    <button
                        type="button"
                        id="increaseBtn"
                    >
                        +
                    </button>

                </div>

            </div>


            <!-- =================================================
                 CART / BUY BUTTONS
            ================================================== -->

            <div class="buttons">

                <button
                    type="button"
                    id="addToCartBtn"
                    class="add-cart"
                >
                    Add to Cart
                </button>


                <button
                    type="button"
                    id="buyNowBtn"
                    class="buy-now"
                >
                    Buy Now
                </button>

            </div>


            <!-- =================================================
                 AR TRY-ON
            ================================================== -->

            <button
                type="button"
                id="tryOnBtn"
                class="try-ar"
            >
                Try With AR
            </button>


        </div>

    </section>

</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="/js/product_details.js"></script>

</body>

</html>
