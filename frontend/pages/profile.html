<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - AR Ecommerce</title>

    <link
        rel="stylesheet"
        href="/css/profile.css"
    >

</head>

<body>

    <div class="profile-container">

        <div class="profile-card">

            <!-- CLOSE ONLY -->
            <!-- This does NOT logout -->

            <button
                type="button"
                id="close-profile"
                class="close-btn"
            >
                ×
            </button>


            <h1>
                My Profile
            </h1>


            <div class="profile-info">

                <p>
                    <strong>Name:</strong>

                    <span id="profile-name">
                        Loading...
                    </span>
                </p>


                <p>
                    <strong>Email:</strong>

                    <span id="profile-email">
                        Loading...
                    </span>
                </p>

            </div>


            <!-- LOGOUT -->

            <button
                type="button"
                id="logout-button"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </div>


    <!-- SEPARATE JAVASCRIPT FILE -->

    <script
        src="/js/profile.js"
    ></script>

</body>

</html>
