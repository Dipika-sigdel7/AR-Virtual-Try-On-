<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - AR Ecommerce</title>

    <link
        rel="stylesheet"
        href="/css/profile.css"
    >

</head>


<body>


<div class="profile-container">

    <div class="profile-card">


        <!-- CLOSE -->

        <button
            type="button"
            id="close-profile"
            class="close-btn"
            aria-label="Close profile"
        >
            ×
        </button>


        <!-- AVATAR -->

        <div class="profile-avatar">
            👤
        </div>


        <!-- TITLE -->

        <h1>
            My Profile
        </h1>


        <p class="profile-subtitle">
            Manage your account information
        </p>


        <!-- PROFILE INFORMATION -->

        <div class="profile-info">


            <!-- NAME -->

            <div class="profile-field">

                <div class="field-icon">
                    👤
                </div>


                <div class="field-content">

                    <span class="field-label">
                        Name
                    </span>


                    <span
                        id="profile-name"
                        class="field-value"
                    >
                        Loading...
                    </span>

                </div>

            </div>


            <!-- EMAIL -->

            <div class="profile-field">

                <div class="field-icon">
                    ✉️
                </div>


                <div class="field-content">

                    <span class="field-label">
                        Email Address
                    </span>


                    <span
                        id="profile-email"
                        class="field-value"
                    >
                        Loading...
                    </span>

                </div>

            </div>


        </div>


        <!-- LOGOUT -->

        <button
            type="button"
            id="logout-button"
            class="logout-button"
        >

            <span class="logout-icon">
                ↪
            </span>

            Logout

        </button>


    </div>

</div>


<script src="/js/profile.js"></script>

</body>

</html>
