<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - AR Ecommerce</title>

    <!-- Main website CSS -->
    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <!-- Profile page CSS -->
    <link
        rel="stylesheet"
        href="/css/profile.css"
    >

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="navbar">

        <div class="logo">

            AR <span>Ecommerce</span>

        </div>


        <nav>

            <a href="/" class="active">
                Home
            </a>

            <a href="/products">
                Products
            </a>

            <a href="/services">
                Services
            </a>

            <a href="/about">
                About
            </a>

        </nav>


        <div class="nav-actions">

            <div id="auth-actions">

                <a
                    href="/profile"
                    class="profile-btn"
                >
                    👤 Profile
                </a>

            </div>


            <button
                class="cart-btn"
                id="cart-btn"
                type="button"
            >

                🛒

                <span>
                    Cart
                </span>

                <b id="cart-count">
                    0
                </b>

            </button>

        </div>

    </header>


    <!-- =====================================================
         PROFILE
    ====================================================== -->

    <main class="profile-page">

        <div class="profile-card">


            <!-- CLOSE PROFILE -->

            <button
                class="profile-close"
                id="profile-close"
                type="button"
                aria-label="Close profile"
            >
                ✕
            </button>


            <!-- AVATAR -->

            <div class="profile-avatar">
                👤
            </div>


            <h1>
                My Profile
            </h1>


            <!-- USER INFORMATION -->

            <div class="profile-info">

                <p>

                    <strong>
                        Name:
                    </strong>

                    <span id="profile-name">
                        Loading...
                    </span>

                </p>


                <p>

                    <strong>
                        Email:
                    </strong>

                    <span id="profile-email">
                        Loading...
                    </span>

                </p>


                <p>

                    <strong>
                        Role:
                    </strong>

                    <span id="profile-role">
                        Loading...
                    </span>

                </p>

            </div>


            <!-- LOGOUT -->

            <button
                class="logout-btn"
                id="logout-btn"
                type="button"
            >
                Logout
            </button>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="/js/profile.js"
        defer
    ></script>

</body>

</html>
