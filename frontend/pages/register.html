<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - AR E-Commerce</title>

    <link
        rel="stylesheet"
        href="/css/register.css"
    >

</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <h1>Create Account</h1>

            <p class="register-subtitle">
                Create your account to start shopping
            </p>


            <form id="registerForm">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-button"
                    id="registerButton"
                >
                    Create Account
                </button>


                <!-- MESSAGE -->

                <p
                    id="registerMessage"
                    class="register-message"
                ></p>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>


            <!-- HOME -->

            <a
                href="/"
                class="back-home"
            >
                ← Continue Shopping
            </a>

        </div>

    </div>


    <script src="/js/register.js"></script>

</body>

</html>
