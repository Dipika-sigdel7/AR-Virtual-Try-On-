<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - AR E-Commerce</title>

    <link
        rel="stylesheet"
        href="/css/login.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to continue shopping
            </p>


            <!-- ==========================
                 LOGIN FORM
            =========================== -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>


                <!-- LOGIN MESSAGE -->

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <!-- REGISTER -->

            <div class="register-link">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>


            <!-- HOME -->

            <a
                href="/"
                class="back-home"
            >
                ← Continue Shopping
            </a>

        </div>

    </div>


    <!-- LOGIN JAVASCRIPT -->

    <script src="/js/login.js"></script>

</body>

</html>
