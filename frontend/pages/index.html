<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR Ecommerce</title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="navbar">


        <!-- LOGO -->

        <div class="logo">

            AR <span>Ecommerce</span>

        </div>


        <!-- NAVIGATION -->

        <nav>

            <a
                href="/"
                class="active"
            >
                Home
            </a>

            <a href="/products">
                Products
            </a>

            <a href="/services">
                Services
            </a>

            <a href="/about">
                About
            </a>

        </nav>


        <!-- NAVIGATION ACTIONS -->

        <div class="nav-actions">


            <!-- =================================================
                 LOGIN / PROFILE
            ================================================== -->

            <div id="auth-actions">

                <a
                    href="/login"
                    id="auth-btn"
                    class="profile-btn"
                >
                    Login
                </a>

            </div>


            <!-- =================================================
                 CART
            ================================================== -->

            <button
                class="cart-btn"
                id="cart-btn"
                type="button"
            >

                🛒

                <span>
                    Cart
                </span>

                <b id="cart-count">
                    0
                </b>

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN HOME PAGE
         
         Put your existing home page content here.
    ====================================================== -->

    <main>

        <section class="hero">

            <h1>
                Welcome to AR Ecommerce
            </h1>

            <p>
                Explore our products and services.
            </p>

        </section>

    </main>



    <!-- =====================================================
         PROFILE POPUP
         
         This is NOT a separate page.
    ====================================================== -->

    <div
        class="profile-overlay"
        id="profile-overlay"
    >


        <div class="profile-card">


            <!-- CLOSE -->

            <button
                class="profile-close"
                id="profile-close"
                type="button"
                aria-label="Close profile"
            >
                ✕
            </button>


            <!-- AVATAR -->

            <div class="profile-avatar">

                👤

            </div>


            <!-- TITLE -->

            <h2>
                My Profile
            </h2>


            <!-- USER INFORMATION -->

            <div class="profile-info">


                <!-- NAME -->

                <p>

                    <strong>
                        Name:
                    </strong>

                    <span id="profile-name">
                        Loading...
                    </span>

                </p>


                <!-- EMAIL -->

                <p>

                    <strong>
                        Email:
                    </strong>

                    <span id="profile-email">
                        Loading...
                    </span>

                </p>


                <!-- ROLE -->

                <p>

                    <strong>
                        Role:
                    </strong>

                    <span id="profile-role">
                        User
                    </span>

                </p>

            </div>


            <!-- LOGOUT -->

            <button
                class="logout-btn"
                id="logout-btn"
                type="button"
            >
                Logout
            </button>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="/js/script.js"
        defer
    ></script>


</body>

</html>
