<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR Ecommerce</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="navbar">


        <!-- LOGO -->

        <div class="logo">

            AR <span>Ecommerce</span>

        </div>


        <!-- NAVIGATION -->

        <nav>

            <a
                href="/"
                class="active"
            >
                Home
            </a>

            <a href="/products">
                Products
            </a>

            <a href="/services">
                Services
            </a>

            <a href="/about">
                About
            </a>

        </nav>


        <!-- =================================================
             NAVIGATION ACTIONS
        ================================================== -->

        <div class="nav-actions">


            <!-- LOGIN / PROFILE BUTTON -->

            <div id="auth-actions">

                <button
                    type="button"
                    id="auth-btn"
                    class="profile-btn"
                >
                    Login
                </button>

            </div>


            <!-- CART -->

            <button
                class="cart-btn"
                id="cart-btn"
                type="button"
            >

                🛒

                <span>
                    Cart
                </span>

                <b id="cart-count">
                    0
                </b>

            </button>

        </div>

    </header>



    <!-- =====================================================
         YOUR EXISTING HOME PAGE CONTENT
         
         DO NOT CHANGE YOUR EXISTING HOME CONTENT.
    ====================================================== -->

    <main>

        <section class="hero">

            <h1>
                Welcome to AR Ecommerce
            </h1>

            <p>
                Explore our products and services.
            </p>

        </section>

    </main>



    <!-- =====================================================
         PROFILE POPUP
         
         This is part of HOME PAGE.
         There is NO separate profile page.
    ====================================================== -->

    <div
        id="profile-overlay"
        class="profile-overlay"
    >

        <div class="profile-card">


            <!-- CLOSE BUTTON -->

            <button
                type="button"
                id="profile-close"
                class="profile-close"
                aria-label="Close profile"
            >
                ✕
            </button>


            <!-- AVATAR -->

            <div class="profile-avatar">

                👤

            </div>


            <!-- TITLE -->

            <h2>
                My Profile
            </h2>


            <!-- USER INFORMATION -->

            <div class="profile-info">

                <div class="profile-row">

                    <strong>
                        Name
                    </strong>

                    <span id="profile-name">
                        Loading...
                    </span>

                </div>


                <div class="profile-row">

                    <strong>
                        Email
                    </strong>

                    <span id="profile-email">
                        Loading...
                    </span>

                </div>


                <div class="profile-row">

                    <strong>
                        Role
                    </strong>

                    <span id="profile-role">
                        User
                    </span>

                </div>

            </div>


            <!-- LOGOUT -->

            <button
                type="button"
                id="logout-btn"
                class="profile-logout-btn"
            >
                Logout
            </button>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="/js/script.js"
        defer
    ></script>

</body>

</html>
