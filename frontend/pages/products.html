<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | AR Ecommerce</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/products.css"
    >

</head>

<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="logo">
        AR <span>Ecommerce</span>
    </div>


    <nav>

        <a href="/">
            Home
        </a>

        <a
            href="/products"
            class="active"
        >
            Products
        </a>

        <a href="/services">
            Services
        </a>

        <a href="/about">
            About
        </a>

    </nav>


    <!-- CART -->

    <div class="nav-actions">

        <button
            class="cart-btn"
            id="cart-btn"
            type="button"
        >

            🛒

            <span>
                Cart
            </span>

            <b id="cart-count">
                0
            </b>

        </button>

    </div>

</header>



<!-- =========================================================
     PRODUCTS
========================================================= -->

<main class="products-page">


    <!-- PAGE HEADING -->

    <section class="page-heading">

        <p class="section-label">
            OUR COLLECTION
        </p>

        <h1>
            Featured Products
        </h1>

        <p>
            Explore our products and experience
            a smarter way of online shopping.
        </p>

    </section>



    <!-- =====================================================
         PRODUCTS LOADED FROM DATABASE
    ====================================================== -->

    <section class="products">

        <div
            class="product-grid"
            id="product-grid"
        >

            <div class="products-loading">

                <div class="loading-spinner"></div>

                <p>
                    Loading products...
                </p>

            </div>

        </div>

    </section>

</main>



<!-- =========================================================
     CART MODAL
========================================================= -->

<div
    class="cart-modal"
    id="cart-modal"
>

    <div class="cart-content">


        <!-- CART HEADER -->

        <div class="cart-header">

            <h2>
                🛒 Your Cart
            </h2>


            <button
                class="cart-close"
                id="cart-close"
                type="button"
            >
                ✕
            </button>

        </div>



        <!-- CART ITEMS -->

        <div id="cart-items">

            <p class="cart-empty">
                Your cart is empty.
            </p>

        </div>



        <!-- TOTAL -->

        <div class="cart-total">

            <strong>
                Total:
            </strong>

            <strong id="cart-total">
                $0.00
            </strong>

        </div>



        <!-- CHECKOUT -->

        <button
            class="checkout-btn"
            id="checkout-btn"
            type="button"
        >
            Proceed to Checkout
        </button>

    </div>

</div>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    <div class="footer-logo">
        AR Ecommerce
    </div>

    <p>
        © 2026 AR Ecommerce. All Rights Reserved.
    </p>

</footer>



<script src="/js/products.js"></script>

</body>

</html>
