<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products - AR E-Commerce</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/products.css"
    >

</head>


<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<header class="navbar">

    <div class="logo">
        AR E-Commerce
    </div>


    <nav class="nav-links">

        <a href="/">
            Home
        </a>

        <a
            href="/products"
            class="active"
        >
            Products
        </a>

        <a href="/services">
            Services
        </a>

        <a href="/about">
            About
        </a>

        <a href="/login">
            Login
        </a>

    </nav>


    <!-- CART -->

    <button
        type="button"
        id="cart-btn"
        class="cart-btn"
    >

        🛒

        <span id="cart-count">
            0
        </span>

    </button>

</header>



<!-- =====================================================
     PRODUCTS PAGE
===================================================== -->

<main class="products-page">


    <!-- PAGE HEADER -->

    <section class="products-header">

        <p class="section-label">
            OUR COLLECTION
        </p>

        <h1>
            Explore Products
        </h1>

        <p>
            Discover products available in our store.
        </p>

    </section>



    <!-- =================================================
         IMPORTANT
         
         products.js searches for:
         
         categories-container
    ================================================== -->

    <div
        id="categories-container"
        class="categories-container"
    >

        <div class="loading-products">
            Loading products...
        </div>

    </div>


</main>



<!-- =====================================================
     CART MODAL
===================================================== -->

<div
    id="cart-modal"
    class="cart-modal"
>

    <div class="cart-content">


        <div class="cart-header">

            <h2>
                Your Cart
            </h2>

            <button
                type="button"
                id="cart-close"
                class="cart-close"
            >
                ×
            </button>

        </div>


        <div
            id="cart-items"
            class="cart-items"
        >

            <p class="empty-cart">
                Your cart is empty.
            </p>

        </div>


        <div class="cart-footer">

            <div class="cart-total-row">

                <strong>
                    Total
                </strong>

                <strong id="cart-total">
                    $0.00
                </strong>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="/js/products.js"></script>

</body>

</html>
