<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | AR Ecommerce</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/products.css"
    >

</head>

<body>

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="navbar">

        <div class="logo">
            AR <span>Ecommerce</span>
        </div>


        <nav>

            <a href="/">
                Home
            </a>

            <a
                href="/products"
                class="active"
            >
                Products
            </a>

            <a href="/services">
                Services
            </a>

            <a href="/about">
                About
            </a>

        </nav>


        <!-- CART -->

        <div class="nav-actions">

            <button
                class="cart-btn"
                id="cart-btn"
                type="button"
            >

                🛒

                <span>
                    Cart
                </span>

                <b id="cart-count">
                    0
                </b>

            </button>

        </div>

    </header>


    <!-- =====================================================
         PRODUCTS PAGE
    ====================================================== -->

    <main class="products-page">


        <!-- PAGE HEADING -->

        <section class="products-heading">

            <p class="section-label">
                OUR COLLECTION
            </p>

            <h1>
                Explore Our Products
            </h1>

            <p>
                Browse products by category and find exactly
                what you are looking for.
            </p>

        </section>


        <!-- =================================================
             CATEGORY PRODUCTS
        ================================================== -->

        <section
            id="category-products"
            class="category-products"
        >

            <!-- Products will be loaded here by JavaScript -->

            <div class="products-loading">

                <div class="loading-spinner"></div>

                <p>
                    Loading products...
                </p>

            </div>

        </section>


    </main>


    <!-- =====================================================
         CART MODAL
    ====================================================== -->

    <div
        class="cart-modal"
        id="cart-modal"
    >

        <div class="cart-content">

            <div class="cart-header">

                <h2>
                    🛒 Your Cart
                </h2>

                <button
                    class="cart-close"
                    id="cart-close"
                    type="button"
                >
                    ✕
                </button>

            </div>


            <div id="cart-items">

                <p class="cart-empty">
                    Your cart is empty.
                </p>

            </div>


            <div class="cart-total">

                <strong>
                    Total:
                </strong>

                <strong id="cart-total">
                    $0
                </strong>

            </div>


            <button
                class="checkout-btn"
                id="checkout-btn"
                type="button"
            >
                Proceed to Checkout
            </button>

        </div>

    </div>


    <!-- =====================================================
         PRODUCT DETAILS MODAL
    ====================================================== -->

    <div
        class="product-modal"
        id="product-modal"
    >

        <div class="product-modal-content">

            <button
                class="modal-close"
                id="modal-close"
                type="button"
            >
                ✕
            </button>


            <div class="modal-product">

                <div class="modal-product-image">

                    <img
                        id="modal-image"
                        src=""
                        alt="Product"
                    >

                </div>


                <div class="modal-product-details">

                    <p
                        class="category"
                        id="modal-category"
                    >
                    </p>


                    <h2 id="modal-name">
                    </h2>


                    <h3 id="modal-price">
                    </h3>


                    <p id="modal-description">
                    </p>


                    <p
                        id="modal-stock"
                        class="modal-stock"
                    >
                    </p>


                    <button
                        id="modal-add-cart"
                        class="add-btn modal-add-btn"
                        type="button"
                    >
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div class="footer-logo">
            AR Ecommerce
        </div>

        <p>
            © 2026 AR Ecommerce. All rights reserved.
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <!-- IMPORTANT:
         app.js first because it contains the common
         cart functionality.
    -->

    <script src="/js/app.js"></script>

    <script src="/js/products.js"></script>

</body>

</html>
